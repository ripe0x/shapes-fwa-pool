[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{access = "read", path = "./deploy"}, {access = "read-write", path = "./sim/out"}, {access = "read", path = "./test/fixtures"}]
# Cache fork state. Tenderly's public gateway throttles bursts, so run fork tests with
# --fork-retries 30 --fork-retry-backoff 5000 --compute-units-per-second 100.
rpc_storage_caching = { chains = ["mainnet"], endpoints = "all" }

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
mainnet = "https://mainnet.gateway.tenderly.co"

[profile.default.invariant]
runs = 16
depth = 25
fail_on_revert = false
