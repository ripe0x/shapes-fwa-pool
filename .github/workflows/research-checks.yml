name: Research and keeper safety checks

on:
  pull_request:

jobs:
  python-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify keeper policy and mixed-size redemption
        run: python3 keeper/test_policy.py
      - name: Verify revenue model and full-budget admission arithmetic
        run: python3 -m unittest discover -s sim -p "test_mint_policy_research.py" -v

# This workflow is intentionally not a substitute for Foundry's current-block
# mainnet fork tests, complete asset-flow reconciliation or security review.

  solidity-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Compile and verify deployed code sizes
        run: forge build --sizes

  current-contract-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Verify real FWA backing and restock behavior on mainnet fork
        run: >
          forge test --match-path test/fork/ForkBacking.t.sol
          --rpc-url https://mainnet.gateway.tenderly.co
          --fork-retries 30 --fork-retry-backoff 5000
          --compute-units-per-second 100 -vv
      - name: Validate vault lifecycle and holder withdrawals on mainnet fork
        run: >
          forge test --match-path test/fork/ForkVaultLifecycle.t.sol
          --rpc-url https://mainnet.gateway.tenderly.co
          --fork-retries 30 --fork-retry-backoff 5000
          --compute-units-per-second 100 -vv
      - name: Validate adversarial keeper and accounting paths on mainnet fork
        run: >
          forge test --match-path test/fork/ForkVaultAdversarial.t.sol
          --rpc-url https://mainnet.gateway.tenderly.co
          --fork-retries 30 --fork-retry-backoff 5000
          --compute-units-per-second 100 -vv
